[pytest]
testpaths = tests
pythonpath = .
# Remaining warnings are emitted at import time from inside openjiuwen
# (pydantic class-based Config, SQLAlchemy declarative_mixin) and cannot be
# fixed from this repo.  Filter only those two exact messages so any new
# warning from our own code still surfaces.
filterwarnings =
    ignore:Support for class-based `config` is deprecated:pydantic.warnings.PydanticDeprecatedSince20:openjiuwen\..*
    ignore:The declarative_mixin decorator was used only by the now removed mypy plugin:sqlalchemy.exc.SADeprecationWarning:openjiuwen\..*
